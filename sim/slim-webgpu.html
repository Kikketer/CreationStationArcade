<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MakeCode Arcade Simulator - WebGPU</title>
    <link rel="stylesheet" type="text/css" href="./cdn/blob/8b3f22bae6fc8b1b15e7ab2f08fd9011c76ef3e0/sim.css">
    <link rel="stylesheet" type="text/css" href="./slim.css" />
    <style>
        #webgpu-indicator {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 255, 0, 0.7);
            color: black;
            font-family: monospace;
            z-index: 1000;
            display: none;
        }
        #webgpu-indicator.fallback {
            background: rgba(255, 165, 0, 0.7);
        }
    </style>
    <!-- MakeCode Simulator Core -->
    <script src="./cdn/blob/2d08fa8f711bf043a6ca3881650c374436268624/pxtsim.js"></script>
    <script src="./cdn/blob/2f9760da20f067b421f461f495a4bac63fbe797a/sim.js"></script>
    <!-- WebGPU Renderer and Patch -->
    <script src="./webgpu-renderer.js"></script>
    <script src="./webgpu-patch.js"></script>
    <script>
        window.addEventListener('load', () => {
            const indicator = document.getElementById('webgpu-indicator');
            setTimeout(() => {
                if (window.WebGPUPatch) {
                    if (window.WebGPUPatch.isActive()) {
                        indicator.textContent = 'WebGPU';
                        indicator.style.display = 'block';
                        indicator.classList.remove('fallback');
                        console.log('WebGPU rendering active');
                    } else {
                        indicator.textContent = 'Canvas 2D';
                        indicator.style.display = 'block';
                        indicator.classList.add('fallback');
                        console.log('Falling back to Canvas 2D rendering');
                    }
                }
            }, 2000);
        });
    </script>
</head>
<body id="root">
    <div id="webgpu-indicator">WebGPU</div>
    <canvas id="game-screen" class="hidden" tabindex="0" role="application"></canvas>
    <div id="wrap">
        <div class="game-player">
            <div id="debug-stats"></div>
            <div class="game-embed">
            </div>
            <div class="game-sys-button-group">
                <button class="game-sys-button game-menu-button no-select">Menu</button>
                <button class="game-sys-button game-reset-button no-select">
                    <i></i>
                </button>
            </div>
            <div id="game-buttons-container" class="game-buttons">
                <svg xmlns="http://www.w3.org/2000/svg" class="game-button-svg" viewBox="0 0 40 40" width="200px" height="200px">
                    <circle class="button-b" cx="13" cy="28" r="9" fill="var(--sim-button-fill)" stroke="var(--sim-button-stroke)" stroke-width="2.5" />
                    <text class="label-b no-select" x="13" y="28" text-anchor="middle" dy="2.5" font-size="8">B</text>
                    <circle class="button-a" cx="28" cy="12.5" r="9" fill="var(--sim-button-fill)" stroke="var(--sim-button-stroke)" stroke-width="2.5" />
                    <text class="label-a no-select" x="28" y="12.5" text-anchor="middle" dy="2.5" font-size="8">A</text>
                </svg>
            </div>
            <div id="joystick-container" class="game-joystick">
                <svg xmlns="http://www.w3.org/2000/svg" class="game-joystick-svg" viewBox="1 0 40 40" width="200px" height="200px">
                    <circle class="joystick-background" cx="20" cy="20" r="16" fill="var(--sim-dpad-fill)" stroke="var(--sim-button-stroke)" stroke-width="2" />
                    <rect class="dpad-up" x="16" y="6" width="8" height="12" rx="2" fill="var(--sim-text-color)" stroke="none" stroke-width="1" />
                    <rect class="dpad-down" x="16" y="22" width="8" height="12" rx="2" fill="var(--sim-text-color)" stroke="none" stroke-width="1" />
                    <rect class="dpad-right" x="22" y="16" width="12" height="8" ry="2" fill="var(--sim-text-color)" stroke="none" stroke-width="1" />
                    <rect class="dpad-left" x="6" y="16" width="12" height="8" ry="2" fill="var(--sim-text-color)" stroke="none" stroke-width="1" />
                    <circle cx="20" cy="20" r="6" fill="var(--sim-text-color)" />
                    <circle class="joystick-handle" cx="20" cy="20" r="6" fill="var(--sim-button-fill)" stroke="#999" stroke-width="2" />
                </svg>
            </div>
            <div class="game-player-background"></div>
            <div class="game-player-msft"></div>
        </div>
        <div id="safari-enable-game" style="display: none">
            <div class="safari-enable-game-body">
                <div class="title">Game Paused</div>
                <div class="body">Click to start the game</div>
                <button>Start Game</button>
            </div>
        </div>
    </div>
</body>
</html>
