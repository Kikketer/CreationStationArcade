name: Installer tests

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "tests/test-installer.sh"
      - ".github/workflows/installer-tests.yml"
  pull_request:
    paths:
      - "install.sh"
      - "tests/test-installer.sh"
      - ".github/workflows/installer-tests.yml"

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n tests/test-installer.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -x install.sh tests/test-installer.sh

      - name: Run installer unit tests
        run: tests/test-installer.sh
