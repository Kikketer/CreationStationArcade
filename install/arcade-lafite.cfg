# /etc/arcade.cfg — GPIO button config for the native MakeCode Arcade Game binary.
#
# The Game binary reads this file at startup (Linux only). If it doesn't
# exist, GPIO input is off and only keyboard/joystick input works — which is
# what you want on a regular computer.
#
# Install this file to /etc/arcade.cfg on the cabinet, or point the
# ARCADE_GPIO_CFG environment variable at a different file.
#
# Pin numbers are gpiochip line offsets. This map is for the aml-s905x-cc
# (Le Potato) header layout — verified on-device with gpiomon/gpioinfo.
# The Game binary takes a single GPIOCHIP, so this map uses gpiochip1 only.
#
# Pins that DON'T work for buttons on this board (kernel claims them for
# their alt function — requesting them fails with ENXIO):
#   - GPIODV_*  (pins 27, 28 — i2c)
#   - GPIOX_0..GPIOX_5 minus the ones in use below (WIFI_SD_* / SDIO pads,
#     pins 22, 26, 38, 40)
#   - GPIOX_8..11 (UART_C / SPI, pins 19, 21, 23, 24)
#   - GPIOCLK_0 (pin 7 — claimed by the clock function)
#   - GPIOAO_* (pins 3, 5, 11, 12, 13 — all on gpiochip0; pin 15 is TEST_N,
#     do not touch)
# Buttons are wired between the pin and GND (ACTIVE_LOW=1, internal
# pull-up enabled). Set ACTIVE_LOW=0 for buttons wired to 3.3 V.
#
# Button names: BTN_UP BTN_DOWN BTN_LEFT BTN_RIGHT BTN_A BTN_B BTN_MENU
#   BTN_RESET BTN_EXIT
# Extra players use a 2/3/4 suffix: BTN_UP2, BTN_A3, BTN_LEFT4, ...

# Which GPIO chip to use. Accepts a full path or just the chip number.
GPIOCHIP=1

# 1 = buttons pull the pin to GND (use internal pull-ups, default)
# 0 = buttons pull the pin to 3.3 V (use internal pull-downs)
ACTIVE_LOW=1

# Player 1            line  name        header pin
BTN_UP=97           #   97  GPIOX_18    31
BTN_DOWN=92         #   92  GPIOX_13    10
BTN_LEFT=85         #   85  GPIOX_6     33
BTN_RIGHT=96        #   96  GPIOX_17    29
BTN_A=84            #   84  GPIOX_5     37
BTN_B=86            #   86  GPIOX_7     35

# Cabinet controls — not wired on this cabinet yet. The uinput reset
# helper (gpio-reset-keyboard-gpiod.py) covers reset via a uinput 'r'
# key on header pin 8 (line 91). Free lines that passed the request
# test: 87 (pin 19), 88 (pin 21), 92-94 are in use.
#BTN_MENU=94        #   94  GPIOX_15    18
#BTN_RESET=93       #   93  GPIOX_14    16
#BTN_EXIT=87        #   87  GPIOX_8     19
