<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creation Station Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --card-bg: #14141e;
      --card-active: #1e1e30;
      --accent: #e040fb;
      --accent2: #40c4ff;
      --text: #f0f0ff;
      --muted: #666688;
      --border: #2a2a44;
      --glow: 0 0 24px rgba(224, 64, 251, 0.45);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 40px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1.1;
    }

    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #carousel-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      padding: 0 24px;
    }

    #carousel {
      display: flex;
      align-items: center;
      gap: 20px;
      overflow: hidden;
      padding: 16px 0;
      position: relative;
    }

    .game-card {
      flex: 0 0 200px;
      height: 240px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      padding: 20px;
      position: relative;
    }

    .game-card .icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .game-card .label {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      word-break: break-word;
    }

    .game-card.selected {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: var(--glow);
      transform: scale(1.06);
    }

    .game-card.selected .label {
      color: #fff;
    }

    #controls-hint {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-align: center;
      display: flex;
      gap: 24px;
    }

    #controls-hint span::before { content: ""; }

    .hint-key {
      display: inline-block;
      background: #1a1a2e;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.75rem;
      margin-right: 4px;
      color: var(--text);
    }

    #loading {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.1em;
    }

    #no-games {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }

    #no-games h2 { font-size: 1.4rem; color: var(--text); }
    #no-games p  { font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Creation Station Arcade</h1>
      <p>Select a game to play</p>
    </header>

    <div id="loading">Loading games…</div>

    <div id="no-games">
      <h2>No games found</h2>
      <p>Add <code>.js</code> game files to the <code>games/</code> directory.</p>
    </div>

    <div id="carousel-wrap" style="display:none;">
      <div id="carousel"></div>
    </div>

    <div id="controls-hint" style="display:none;">
      <span><span class="hint-key">◀ ▶</span> Navigate</span>
      <span><span class="hint-key">Enter</span> / <span class="hint-key">A</span> Play</span>
    </div>
  </div>

  <script>
    const HEARTBEAT_INTERVAL = 5000;
    const CARD_WIDTH = 220; // card + gap approx

    let games = [];
    let selectedIndex = 0;
    let gamepadLoop = null;
    let lastGamepadInput = 0;
    const GAMEPAD_REPEAT_DELAY = 200; // ms

    // ── Heartbeat ────────────────────────────────────────────────────────────
    function startHeartbeat() {
      setInterval(() => {
        fetch("/api/heartbeat").catch(() => {});
      }, HEARTBEAT_INTERVAL);
    }

    // ── Load games from API ───────────────────────────────────────────────────
    async function loadGames() {
      try {
        const res = await fetch("/api/games");
        games = await res.json();
      } catch (e) {
        games = [];
      }

      document.getElementById("loading").style.display = "none";

      if (!games.length) {
        document.getElementById("no-games").style.display = "flex";
        return;
      }

      document.getElementById("carousel-wrap").style.display = "block";
      document.getElementById("controls-hint").style.display = "flex";
      renderCarousel();
      startHeartbeat();
    }

    // ── Render carousel ───────────────────────────────────────────────────────
    const ICONS = ["🎮", "🕹️", "👾", "🏆", "⚔️", "🐱", "🚀", "🌟", "🔥", "🎯",
                   "💫", "🎲", "🌊", "🦊", "🤖", "🐸", "🎵", "🌈", "💥", "🧩"];

    function iconFor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
      return ICONS[h % ICONS.length];
    }

    function renderCarousel() {
      const el = document.getElementById("carousel");
      el.innerHTML = "";
      games.forEach((g, i) => {
        const card = document.createElement("div");
        card.className = "game-card" + (i === selectedIndex ? " selected" : "");
        card.dataset.index = i;
        card.innerHTML = `<div class="icon">${iconFor(g.name)}</div><div class="label">${g.name}</div>`;
        card.addEventListener("click", () => { selectedIndex = i; selectGame(i); });
        el.appendChild(card);
      });
      scrollToSelected();
    }

    function scrollToSelected() {
      const carousel = document.getElementById("carousel");
      const cards = carousel.querySelectorAll(".game-card");
      cards.forEach((c, i) => {
        c.classList.toggle("selected", i === selectedIndex);
      });

      // Center the selected card
      const wrap = document.getElementById("carousel-wrap");
      const wrapW = wrap.offsetWidth;
      const card = cards[selectedIndex];
      if (!card) return;
      const cardCenter = card.offsetLeft + card.offsetWidth / 2;
      const scrollTarget = cardCenter - wrapW / 2;
      carousel.style.transform = `translateX(${-Math.max(0, scrollTarget)}px)`;
    }

    // ── Navigation ────────────────────────────────────────────────────────────
    function move(dir) {
      if (!games.length) return;
      selectedIndex = (selectedIndex + dir + games.length) % games.length;
      scrollToSelected();
    }

    async function selectGame(idx) {
      const g = games[idx ?? selectedIndex];
      if (!g) return;

      // Show launching status
      const statusEl = document.getElementById("loading");
      statusEl.textContent = `Launching ${g.name}...`;
      statusEl.style.display = "block";

      // Call API to launch game in separate Chromium instance
      try {
        const res = await fetch(`/api/launch-game?name=${encodeURIComponent(g.name)}`);
        const data = await res.json();
        if (data.ok) {
          // Game launched - menu stays visible underneath
          statusEl.textContent = "Game launched! Press Kill button to return";
        } else {
          statusEl.textContent = "Launch failed, trying direct...";
          // Fallback: navigate directly
          window.location.href = `/play?game=${encodeURIComponent(g.name)}`;
        }
      } catch (e) {
        // API not available - fallback to navigation
        window.location.href = `/play?game=${encodeURIComponent(g.name)}`;
      }
    }

    // ── Keyboard input ────────────────────────────────────────────────────────
    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowLeft":  e.preventDefault(); move(-1); break;
        case "ArrowRight": e.preventDefault(); move(1);  break;
        case "Enter":
        case " ":          e.preventDefault(); selectGame(); break;
      }
    });

    // ── Gamepad input ─────────────────────────────────────────────────────────
    function pollGamepads() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const now = performance.now();

      for (const pad of pads) {
        if (!pad) continue;

        const left  = pad.buttons[14]?.pressed || pad.axes[0] < -0.5;
        const right = pad.buttons[15]?.pressed || pad.axes[0] > 0.5;
        const a     = pad.buttons[0]?.pressed || pad.buttons[1]?.pressed;

        if (now - lastGamepadInput > GAMEPAD_REPEAT_DELAY) {
          if (left)  { move(-1); lastGamepadInput = now; }
          if (right) { move(1);  lastGamepadInput = now; }
          if (a)     { selectGame(); lastGamepadInput = now; }
        }
      }

      gamepadLoop = requestAnimationFrame(pollGamepads);
    }

    window.addEventListener("gamepadconnected",    () => { if (!gamepadLoop) pollGamepads(); });
    window.addEventListener("gamepaddisconnected", () => {});

    // Start polling immediately in case gamepad is already connected
    pollGamepads();

    // ── Boot ──────────────────────────────────────────────────────────────────
    loadGames();
  </script>
</body>
</html>
