# /sd/arcade.cfg — keyboard scan code layout for MakeCode Arcade ELF
# Used when running via USB gamepad (uinput virtual keyboard mode)
# SCAN_CODES points to the virtual keyboard device created by usb-to-gpio.py
# This file is copied to /sd/arcade.cfg by the setup script

SCAN_CODES=/dev/input/event0
BTN_LEFT=105
BTN_RIGHT=106
BTN_UP=103
BTN_DOWN=108
BTN_A=57
BTN_B=29
BTN_LEFT2=105
BTN_RIGHT2=106
BTN_UP2=103
BTN_DOWN2=108
BTN_A2=57
BTN_B2=29
BTN_RESET=59
BTN_EXIT=1
BTN_MENU=60
